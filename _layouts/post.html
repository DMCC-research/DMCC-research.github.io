---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
      {% if page.research_domain %}<span>{{ page.research_domain }}</span>{% endif %}
    </p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
